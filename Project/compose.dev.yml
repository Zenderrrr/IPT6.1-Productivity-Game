services:
  backend:
    container_name: focusup-backend
    build:
      context: ./Backend/FocusUp
      dockerfile: Dockerfile
      target: development
    ports:
      - "5165:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Resend__ApiKey: ${RESEND_API_KEY}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - ./Backend/FocusUp:/app
      - ./Database:/app/database
  frontend:
    container_name: focusup-frontend
    build: 
      target: development
      context: ./Frontend/FocusUp
      dockerfile: Dockerfile
    volumes:
      - ./Frontend/focusUp:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"

 