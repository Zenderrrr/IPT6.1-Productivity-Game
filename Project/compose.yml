services:
  backend:
    container_name: focusup-backend
    build:
      context: ./Backend/FocusUp
      dockerfile: Dockerfile
      target: ${BUILD_TARGET}
    ports:
      - "5165:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
    volumes:
      - ./Backend/FocusUp:/app
      - ./Database:/app/database
      # - ./Database:/app/database:ro
      # - sqlite-data:/app/Data

  frontend:
    container_name: focusup-frontend
    build:
      context: ./Frontend/focusUp
      dockerfile: Dockerfile
      target: ${BUILD_TARGET}
    ports:
      - "5173:80"
    depends_on:
      - backend
      
volumes:
  sqlite-data: